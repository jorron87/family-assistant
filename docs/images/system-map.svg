<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Slik henger Familien sammen</title>
  <desc id="desc">En påslått Windows-maskin hjemme kjører Chrome, lokal innsamling, review-kø og agent. Agenten bruker familieprofil og originaler før kalender, Drive og familievisning oppdateres. Telefonen kan også sende inn materiale.</desc>
  <defs>


  </defs>
