  <text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53665b" x="58" y="667">Arkivet er lokalt. Modellen og Google er eksterne tjenester. Utløpt innlogging krever fortsatt ny innlogging.</text>
