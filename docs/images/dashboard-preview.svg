<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">En roligere familieoversikt på veggen og i lomma</title>
  <desc id="desc">Konseptskisse med oppdiktede eksempeloppføringer. Dashboardet viser i dag, i morgen og senere. Hvert barn har egne oppgaver. Mobilen har en tydelig knapp for å sende nye beskjeder eller dokumenter.</desc>
