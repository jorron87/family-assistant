<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#faf9f6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Familien"><link rel="manifest" href="/send/manifest.webmanifest"><link rel="icon" href="/send/icon.svg"><link rel="stylesheet" href="/send/phone.css"><link rel="stylesheet" href="/send/clarifications.css"><link rel="stylesheet" href="/send/shopping.css"><link rel="stylesheet" href="/send/library-explorer.css"><title>Familien</title></head>
<body><main><header class="brand"><h1>Familien<span>.</span></h1><span id="today-label">Eksempelfamilien</span></header>
<section id="startup" class="surface" role="status"><p id="startup-message">Åpner familien …</p><button id="startup-retry" type="button">Prøv igjen</button></section>
<section id="pair" class="surface" hidden><h2>Velkommen hjem.</h2><form id="pair-form"><label for="pair-code">Familiekode</label><input id="pair-code" type="password" required autocomplete="off" placeholder="Koden fra familielenken"><input id="device-name" maxlength="100" aria-label="Navn på telefonen" placeholder="Navn på telefonen (valgfritt)"><button>Knytt til familien →</button></form></section>
<div id="family" hidden><div id="person-tabs" class="person-tabs" aria-label="Velg person"></div><section id="family-home"><p id="login-line" class="login-line" role="alert" hidden></p><p id="weather-line" class="weather-line" role="status" hidden></p><div class="view-heading"><h2>Det som skjer</h2><div id="calendar-modes" class="segments" aria-label="Kalendervisning"><button data-mode="agenda" class="selected">Agenda</button><button data-mode="week">Uke</button><button data-mode="month">Måned</button></div></div><div id="mobile-dates"></div><button id="task-summary" class="task-summary" hidden></button><div id="family-agenda"></div></section><section id="family-tasks" hidden><div class="view-heading"><h2>Oppgaver</h2><span id="task-total" class="muted"></span></div><div id="family-task-list"></div><details id="hidden-entries"><summary>Skjulte oppføringer</summary><div id="hidden-list"></div></details></section><section id="family-shopping" hidden></section><section id="family-explore" hidden></section><section id="family-profile" hidden><div class="view-heading"><h2>Profiler</h2></div><div id="mobile-profile-cards"></div></section></div>
<section id="capture" hidden><div class="view-heading"><h2>Send inn</h2><span class="muted">En beskjed eller et bilde.</span></div><form id="send-form" class="surface"><label class="sender-field" for="sender">Fra <select id="sender" required aria-label="Hvem sender?"><option value="">Velg person</option></select></label><textarea id="message" aria-label="Beskjed til Luna" maxlength="20000" rows="3" placeholder="Hva skal familien huske?"></textarea><div class="file-actions"><label class="camera" for="camera"><span aria-hidden="true">◎</span> Ta bilde</label><input id="camera" class="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" capture="environment"><label class="choose" for="files"><span aria-hidden="true">＋</span> Velg filer</label><input id="files" class="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf" multiple></div><div id="previews"></div><div id="members" class="member-chips" aria-label="Hvem gjelder det?"></div><details class="extra-options"><summary>Legg til overskrift</summary><input id="title" maxlength="300" aria-label="Overskrift" placeholder="Kort overskrift"></details><button id="submit" type="submit">Send til Luna →</button></form><section id="receipts" hidden><div class="view-heading"><h3>Sist sendt</h3><span id="receipt-count" class="muted"></span></div><div id="receipt-list"></div></section></section>
<p id="status" role="status" aria-live="polite" hidden></p><footer><button id="logout" type="button" hidden>Koble fra telefonen</button></footer></main>
<nav id="mobile-nav" class="mobile-nav" aria-label="Hovedmeny" hidden><button data-view="home" class="selected">⌂ <span>Hjem</span></button><button data-view="capture" class="send-nav">＋ <span>Send inn</span></button><button data-view="tasks">☑ <span>Oppgaver</span></button><button data-view="shopping">◇ <span>Handel</span></button><button data-view="profile">○ <span>Profiler</span></button></nav>
<dialog id="mobile-event"><div class="sheet-header"><button id="event-close" type="button" aria-label="Lukk oppføringen">← Tilbake</button></div><div id="mobile-event-content"></div></dialog>
<script type="module" src="/send/phone-boot.js"></script></body></html>
